gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=edge_ingest:1m rate=30r/m;
limit_req_status 429;

upstream punch_sync {
    server punch-sync-server:8080;
    keepalive 8;
}

upstream hrms_web {
    server hrms-attendance:3000;
    keepalive 8;
}

# Local emergency/dashboard endpoint. Compose binds this listener to loopback.
server {
    listen 8090;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    location = /health {
        proxy_pass http://punch_sync;
    }

    location = /events {
        limit_except POST { deny all; }
        limit_req zone=edge_ingest burst=10 nodelay;
        proxy_pass http://punch_sync;
    }

    location / {
        auth_basic "Punch Sync";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://punch_sync;
    }
}

server {
    listen 80;
    server_name attendance.codeace.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name attendance.codeace.org;

    ssl_certificate /etc/letsencrypt/live/attendance.codeace.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.codeace.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;

    # Signed edge ingestion remains unauthenticated at the proxy, but is now encrypted.
    location = /events {
        limit_except POST { deny all; }
        limit_req zone=edge_ingest burst=10 nodelay;
        proxy_pass http://punch_sync;
    }

    location /_next/static/ {
        proxy_pass http://hrms_web;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://hrms_web;
        add_header Cache-Control "private, no-store" always;
    }
}
