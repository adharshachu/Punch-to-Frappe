x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: punch-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: punch_sync
      POSTGRES_USER: punch_sync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell or Compose .env file}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=256MB
    volumes:
       - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U punch_sync -d punch_sync"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    pids_limit: 100
    logging: *default-logging

  punch-sync-server:
    image: ${PUNCH_SYNC_IMAGE:?Set PUNCH_SYNC_IMAGE to an immutable version tag or digest}
    container_name: punch-sync-server
    restart: unless-stopped
    user: "10001:10001"
    env_file:
      - .env.server
      - .env.punch.secrets
    command:
      - sh
      - -ec
      - |
        : "$${HRMS_API_KEY:?HRMS_API_KEY is required}"
        : "$${HRMS_API_SECRET:?HRMS_API_SECRET is required}"
        : "$${SERVER_NODE_KEYS:?SERVER_NODE_KEYS is required}"
        : "$${POSTGRES_DSN:?POSTGRES_DSN is required}"
        case "$${HRMS_API_KEY}:$${HRMS_API_SECRET}:$${SERVER_NODE_KEYS}:$${POSTGRES_DSN}" in
          *change_this*|*replace_me*|*example*)
            echo "Refusing to start with placeholder application secrets" >&2
            exit 1
            ;;
        esac
        exec python attendance_sync/server.py
    expose:
      - "8080"
    volumes:
      # Writable so the dashboard Employee Map tab can persist mapping edits.
      # Must be writable by uid 10001 inside the container.
      - ./employee_map.json:/app/employee_map.json
      # Mount .env.server as /app/.env so the dashboard "Configuration" tab can
      # persist edits back to the host file. Restart the container to apply.
      # Must be writable by uid 10001 inside the container.
      - ./.env.server:/app/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; print(json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5))['ok'])",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    pids_limit: 128
    logging: *default-logging

  hrms-attendance:
    image: ${HRMS_ATTENDANCE_IMAGE:?Set HRMS_ATTENDANCE_IMAGE to an immutable version tag or digest}
    container_name: hrms-attendance
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://punch_sync:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell or Compose .env file}@postgres:5432/punch_sync
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      # Kept for backward compatibility with .env.local that may reference
      # host.docker.internal:8090. Inside this compose you can also point
      # HRMS env vars directly at http://punch-sync-server:8080 or http://nginx:8090.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    mem_limit: 256m
    pids_limit: 128
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    container_name: punch-sync-nginx
    restart: unless-stopped
    ports:
      # Emergency/local access only. Remote traffic must use HTTPS on 443.
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8090}:8090"
      # HRMS Attendance (attendance.codeace.org) - HTTP redirect + HTTPS
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      # Let's Encrypt certs (managed on the host by certbot) - read-only
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      punch-sync-server:
        condition: service_healthy
      hrms-attendance:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    mem_limit: 64m
    pids_limit: 64
    logging: *default-logging

volumes:
  postgres_data:
    external: true
    name: root_postgres_data
